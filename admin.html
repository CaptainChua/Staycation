<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Staycation Haven PH</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#f5f5f5;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-box{
            background:white;
            padding:40px;
            border-radius:20px;
            width:400px;
            box-shadow:0 10px 30px rgba(0,0,0,.1);
        }

        h1{
            text-align:center;
            margin-bottom:30px;
        }

        input{
            width:100%;
            padding:15px;
            margin-bottom:15px;
            border:1px solid #ddd;
            border-radius:10px;
        }

        button{
            width:100%;
            padding:15px;
            border:none;
            background:#ff385c;
            color:white;
            border-radius:10px;
            cursor:pointer;
        }

    </style>
</head>
<body>

    <div class="login-box">

        <h1>Admin Login</h1>

        <input type="text" id="username" placeholder="Username" onkeydown="if(event.key==='Enter') login()">

        <input type="password" id="password" placeholder="Password" onkeydown="if(event.key==='Enter') login()">

        <button onclick="login()">Login</button>

        <div style="margin-top:16px; text-align:center;">
            <a href="#" onclick="recoverAdmin(); return false;" style="font-size:13px; color:#8a5a7a; text-decoration:underline; cursor:pointer;">Locked out? Reset admin access</a>
        </div>

    </div>

<script>

// Emergency recovery: reset the administrator's password to 1234 so a locked-out owner can get
// back in. Keeps every user and all bookings — only the admin password is changed. If no admin
// exists on the server it creates the default one. Tells the owner exactly which username to use.
async function recoverAdmin(){
    if(!confirm("Reset the ADMIN password to 1234?\n\nThis keeps all users and bookings — it only changes the administrator's password so you can log back in.")) return;
    try{
        let users = [];
        try{
            const res = await fetch("/api/kv/shph_users", { cache: "no-store" });
            if(res.ok){ const j = await res.json(); if(Array.isArray(j)) users = j; }
        }catch(e){ /* fall through to create */ }
        let admin = users.find(u => u && u.admin);
        if(!admin){
            const nextId = users.reduce((m, u) => Math.max(m, Number(u.id) || 0), 0) + 1;
            admin = { id: nextId, name: "Admin", password: "1234", admin: true, perms: [] };
            users.push(admin);
        }
        admin.password = "1234";
        try{ localStorage.setItem("shph_users", JSON.stringify(users)); }catch(e){}
        const put = await fetch("/api/kv/shph_users", {
            method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(users)
        });
        if(!put.ok) throw new Error("server write failed (HTTP " + put.status + ")");
        document.getElementById("username").value = admin.name;
        document.getElementById("password").value = "1234";
        alert("✅ Admin access restored.\n\nUsername: " + admin.name + "\nPassword: 1234\n\n(I've filled them in — just click Login. You can change the password later under Users.)");
    }catch(e){
        alert("Reset failed: " + e.message + "\n\nPlease tell me this exact message and I'll fix it.");
    }
}

async function login(){

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    // Pull the AUTHORITATIVE user list straight from the shared server first.
    // A stale or empty local copy (e.g. right after a serverless cold start)
    // must never drive the "recovery" below — otherwise logging in would
    // overwrite real users on the server with a lone admin. Only fall back to
    // localStorage if the server is genuinely unreachable.
    let users = null;
    try {
        const res = await fetch("/api/kv/shph_users", { cache: "no-store" });
        if(res.ok){ const j = await res.json(); if(Array.isArray(j)) users = j; }
    } catch(e){ /* offline */ }
    if(users === null){
        try { users = JSON.parse(localStorage.getItem("shph_users")) || []; } catch(e){ users = []; }
    } else {
        try { localStorage.setItem("shph_users", JSON.stringify(users)); } catch(e){}
    }

    const match = users.find(u =>
        (u.name || "").toLowerCase() === username.toLowerCase() && u.password === password);

    if(match){
        localStorage.removeItem("shph_partner_session");   // the two sessions are mutually exclusive
        localStorage.setItem("shph_current_user", match.name);
        logLogin(match.name);
        window.location.href = "/dashboard.html";
    }
    else if(!users.some(u => u.admin) && username !== "" && password === "1234"){
        // genuine fresh setup: the SERVER confirms no administrator exists.
        // create the default admin (added to any existing users) and make sure
        // it reaches the server BEFORE navigating away.
        const nextId = (users.reduce((m, u) => Math.max(m, Number(u.id) || 0), 0) || 0) + 1;
        const adminUser = { id: nextId, name: username, password: "1234", admin: true, perms: [] };
        users.push(adminUser);
        try { localStorage.setItem("shph_users", JSON.stringify(users)); } catch(e){}
        try {
            await fetch("/api/kv/shph_users", {
                method: "PUT", headers: { "Content-Type": "application/json" },
                body: JSON.stringify(users)
            });
        } catch(e){ /* localStorage still holds it */ }
        localStorage.removeItem("shph_partner_session");   // the two sessions are mutually exclusive
        localStorage.setItem("shph_current_user", adminUser.name);
        logLogin(adminUser.name);
        window.location.href = "/dashboard.html";
    }
    else{
        alert("Invalid Login");
    }

}
// record the sign-in into the shared activity log
function logLogin(name){
    let log = [];
    try { log = JSON.parse(localStorage.getItem("shph_activity_log")) || []; } catch(e){}
    log.push({ user: name, action: "logged in", at: new Date().toISOString() });
    localStorage.setItem("shph_activity_log", JSON.stringify(log.slice(-500)));
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll — Staycation Haven PH</title>
    <link rel="icon" href="images/logo.png">
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body{ background:#f5f5f5; color:#444; display:flex; align-items:center; justify-content:center; height:100vh; }
        .loading{ text-align:center; }
        .loading img{ height:40px; margin-bottom:14px; }
        a{ color:#ff385c; }
    </style>
    <script>
        // The Payroll module lives in the admin dashboard. Open the dashboard
        // straight on the Payroll tab so this page shows the same payroll
        // (same staff data, cut-offs, and the bookings calendar it reads from).
        try { localStorage.setItem("shph_dashboard_page", "payroll"); } catch(e){}
        window.location.replace("dashboard.html");
    </script>
</head>
<body>
    <div class="loading">
        <img src="images/logo.png" alt="" onerror="this.remove()">
        <p>Opening Payroll… <a href="dashboard.html">Continue</a></p>
    </div>
</body>
</html>
